<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>$10K by December</title>
<meta name="description" content="Personal savings tracker for a $10,000 goal by 31 December 2026.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090D0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="$10K">
<script>window.APP_VERSION = "3 (30 Oct)";</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="chart.umd.min.js"></script>
<style>
/* Layout: phone-app shell. Compact top bar, large page titles, a deep-green balance card, borderless rounded cards, floating tab bar with an add button. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#EEF2EC; --line:#E2E7DF; --ink:#111915; --muted:#65716A;
  --accent:#13714A; --accent-ink:#FFFFFF; --accent-soft:#E0F1E7; --accent-2:#62BE8F;
  --hero-1:#0C5236; --hero-2:#1B8A5A; --hero-ink:#F3FBF6; --hero-mint:#B9F0D2; --hero-glass:rgba(255,255,255,.14);
  --gold:#9A6F17; --gold-soft:#F6EDD7; --warn:#A04D0B; --warn-soft:#FBEBDA; --bad:#B0342A; --bad-soft:#F9E3DF;
  --info:#355C86; --info-soft:#E4ECF5; --c-tax:#AEB8B1; --c-sl:#CE955B; --c-ks:#6E8FB5; --c-other:#C9C0AB;
  --shadow:0 1px 2px rgba(17,25,21,.04),0 10px 30px rgba(17,25,21,.07);
  --bar-bg:rgba(255,255,255,.82);
  --font-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090D0B; --surface:#131A16; --surface-2:#19221D; --line:#222C27; --ink:#EDF3EF; --muted:#93A199;
  --accent:#4FD08F; --accent-ink:#04140C; --accent-soft:#15301F; --accent-2:#2D8D5F;
  --hero-1:#0B3F2A; --hero-2:#157049; --hero-ink:#F3FBF6; --hero-mint:#9DE9C1; --hero-glass:rgba(255,255,255,.10);
  --gold:#DDB25C; --gold-soft:#2D2614; --warn:#EDA066; --warn-soft:#33241A; --bad:#F08B7E; --bad-soft:#3A1F1C;
  --info:#8EB3DC; --info-soft:#1B2633; --c-tax:#5C6961; --c-sl:#C08550; --c-ks:#6C8DB4; --c-other:#7B7464;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3); --bar-bg:rgba(19,26,22,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D0B; --surface:#131A16; --surface-2:#19221D; --line:#222C27; --ink:#EDF3EF; --muted:#93A199;
  --accent:#4FD08F; --accent-ink:#04140C; --accent-soft:#15301F; --accent-2:#2D8D5F;
  --hero-1:#0B3F2A; --hero-2:#157049; --hero-ink:#F3FBF6; --hero-mint:#9DE9C1; --hero-glass:rgba(255,255,255,.10);
  --gold:#DDB25C; --gold-soft:#2D2614; --warn:#EDA066; --warn-soft:#33241A; --bad:#F08B7E; --bad-soft:#3A1F1C;
  --info:#8EB3DC; --info-soft:#1B2633; --c-tax:#5C6961; --c-sl:#C08550; --c-ks:#6C8DB4; --c-other:#7B7464;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.3); --bar-bg:rgba(19,26,22,.85); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.num,.big,td.n,.tile b{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 170px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(150deg,var(--hero-2),var(--hero-1));color:var(--hero-ink);display:grid;place-items:center;font-weight:800;font-size:.72rem;letter-spacing:-.02em;flex:none}
.brand h1{font-size:.98rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.74rem;font-weight:500}
.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync span{display:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)} .sync.err i{background:var(--warn)}
.gear{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.gear svg{width:19px;height:19px}
.gear[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

nav.tabs{display:none}
nav.bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;max-width:520px;margin-inline:auto;background:var(--bar-bg);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.14);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
nav.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;font-weight:600;color:var(--muted);padding:7px 0 5px;cursor:pointer;border-radius:20px}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:max(18px,calc(50% - 360px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:31;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(150deg,var(--hero-2),var(--hero-1));color:var(--hero-ink);box-shadow:0 10px 26px rgba(12,82,54,.38);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.95)}
@media (min-width:900px){
  .app{max-width:1000px;padding-block:0 60px}
  nav.bottom{display:none}
  .sync span{display:inline}
  nav.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
  nav.tabs button{background:none;border:0;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .gear{display:none}
  .fab{bottom:28px}
}

.view{display:grid;gap:14px;padding-top:4px}
.page-head{display:grid;gap:2px;padding:6px 2px 2px}
.page-title{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.page-head .xs{font-weight:600}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid3{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid4{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid2>*,.grid3>*,.grid4>*{min-width:0}

.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.xs{font-size:.76rem}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.big{font-weight:800;font-size:clamp(2.2rem,9vw,3rem);line-height:1;letter-spacing:-.03em}
.tile{background:var(--surface);border-radius:var(--r-md);padding:14px;display:grid;gap:3px;align-content:start;box-shadow:var(--shadow)}
.tile b{font-size:1.3rem;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.tile .xs{color:var(--muted)}

/* balance card */
.hero-card{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;color:var(--hero-ink);background:radial-gradient(120% 90% at 100% 0%,var(--hero-2) 0%,transparent 60%),linear-gradient(160deg,var(--hero-2),var(--hero-1) 70%);box-shadow:0 16px 40px rgba(12,82,54,.28);display:grid;gap:14px}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.06);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.hero-lab{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero-amt{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hero-amt small{font-size:.45em;font-weight:700;opacity:.8;letter-spacing:-.01em}
.hero-sub{font-size:.9rem;opacity:.9;margin-top:-6px;position:relative;z-index:1}
.hero-bar{height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;position:relative;z-index:1}
.hero-bar i{display:block;height:100%;border-radius:99px;background:var(--hero-mint);transition:width .8s cubic-bezier(.2,.8,.2,1);min-width:12px}
.hero-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.hero-meta div{background:var(--hero-glass);border-radius:16px;padding:10px 12px;display:grid;min-width:0}
.hero-meta b{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-meta span{font-size:.72rem;opacity:.85}
.hero-card .pill{background:rgba(255,255,255,.16);color:var(--hero-ink)}
.hero-card .pill.bad{background:rgba(255,190,180,.22)}

.nextpay{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.nextpay .dateblock{width:58px;border-radius:16px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:8px 0;line-height:1.1}
.nextpay .dateblock b{display:block;font-size:1.5rem;font-weight:800}
.nextpay .dateblock span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.nextpay .amt-l{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

.note{border-radius:var(--r-md);padding:13px 15px;font-size:.88rem;display:grid;gap:4px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.warn b{color:var(--warn)}
.note.info{background:var(--info-soft)}
.note.info b{color:var(--info)}
.note.good{background:var(--accent-soft)}
.note.good b{color:var(--accent)}
.note.bad{background:var(--bad-soft)}
.note.bad b{color:var(--bad)}

.btn{border:0;background:var(--surface-2);padding:10px 16px;border-radius:14px;cursor:pointer;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.ghost{background:none;color:var(--accent);padding-inline:8px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.82rem;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:700px){.qa{grid-template-columns:repeat(6,minmax(0,1fr))}}
.qa .btn{flex-direction:column;background:var(--surface);box-shadow:var(--shadow);padding:14px 4px 12px;font-size:.76rem;min-height:84px;text-align:center;border-radius:20px;gap:8px;font-weight:600}
.qa .btn svg{width:22px;height:22px;padding:9px;box-sizing:content-box;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.qa .btn.primary{background:var(--surface);color:var(--ink)}
.qa .btn.primary svg{background:var(--accent);color:var(--accent-ink)}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:11px;cursor:pointer;font-weight:600;color:var(--muted);font-size:.86rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.segwrap{display:grid}
.card-h .seg{flex:1 1 280px}

/* lists */
.list{display:grid;gap:0}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main .t{font-weight:700;overflow-wrap:anywhere}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.pos{color:var(--accent)} .amt.neg{color:var(--bad)}
.dot{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:.9rem;font-weight:800}
.dot.dep{background:var(--accent-soft);color:var(--accent)}
.dot.wd{background:var(--bad-soft);color:var(--bad)}
.dot.int{background:var(--gold-soft);color:var(--gold)}
.dot.adj{background:var(--info-soft);color:var(--info)}
.row .ops{display:flex;gap:2px;flex:none}
.iconbtn{background:none;border:0;border-radius:11px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

.empty{text-align:center;padding:24px 12px;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:1.05rem}

/* paycheck card */
.pc{border-radius:var(--r-md);padding:14px;display:grid;gap:10px;background:var(--surface-2)}
.pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pc-break{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:.84rem}
@media (min-width:640px){.pc-break{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc-break div{display:flex;justify-content:space-between;gap:6px;min-width:0}
.pc-break span:first-child{color:var(--muted)}
.pc-break span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.split{height:8px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface)}
.split i{display:block;height:100%}

/* calendar */
.wk{border-radius:var(--r-md);padding:14px;display:grid;gap:10px;background:var(--surface);box-shadow:var(--shadow)}
.wk.missed{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 50%,transparent),var(--shadow)}
.wk.current{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.wk-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border-radius:12px;padding:6px 2px;text-align:center;font-size:.68rem;line-height:1.25;background:var(--surface-2);color:var(--muted);min-width:0;font-weight:600}
.day b{display:block;font-size:.9rem;color:var(--ink);font-weight:800}
.day.work{background:var(--accent-soft);color:var(--accent)}
.day.work b{color:var(--accent)}
.day.off{opacity:.7}
.day.na{opacity:.3}
.day.hol{outline:1.5px dashed var(--gold);outline-offset:-2px}
.day.pay{box-shadow:inset 0 -3px 0 var(--gold)}
.wk-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:.84rem}
@media (min-width:640px){.wk-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wk-stats div{display:flex;justify-content:space-between;gap:8px}
.wk-stats span:first-child{color:var(--muted)}
.wk-stats span:last-child{font-variant-numeric:tabular-nums;font-weight:700}

/* milestones */
.ms{display:grid;gap:0}
.ms-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ms-row:first-child{border-top:0}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.74rem;border:2px dashed var(--line);color:var(--muted)}
.medal.on{background:var(--gold-soft);border:2px solid var(--gold);color:var(--gold)}

/* tables */
.tablewrap{overflow-x:auto;border-radius:var(--r-md);background:var(--surface-2)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:500px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr.best td{background:var(--accent-soft)}

/* forms */
.form{display:grid;gap:14px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.fgrid .full{grid-column:1/-1}
.fgrid>*{min-width:0}
.field{display:grid;gap:5px}
.field label,.field .lab{font-size:.78rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid transparent;border-radius:14px;background:var(--surface-2);min-height:46px;font-size:16px;font-weight:600}
.field textarea{min-height:70px;resize:vertical;font-weight:500}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field .hint{font-size:.75rem;color:var(--muted)}
.field.err input,.field.err select{border-color:var(--bad)}
.field .errmsg{font-size:.76rem;color:var(--bad);font-weight:700}
.money-in{position:relative}
.money-in::before{content:"$";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-weight:700}
.money-in input{padding-left:26px}

<script>
"use strict";

const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / MS);

const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(toD(s));
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const money0 = x => (x < 0 ? "−" : "") + "$" + Math.round(Math.abs(x)).toLocaleString("en-NZ");

const weekStart = s => addDays(s, -dow(s));
const monthKey = s => s.slice(0, 7);

const BUILTIN_CATS = ["Food", "Transport", "Shopping", "Subscriptions", "Personal care", "Entertainment", "Family contributions", "Other"];
const MILESTONES = [1000, 2500, 5000, 7500, 10000];

/* ---------------- state ---------------- */
function defaultSettings() {
  return {
    goal: 10000, deadline: "2026-12-31", startBalance: 0, startDate: "2026-10-19",
    hourlyRate: 24.55, weeklyHours: 47, workDays: [0, 1, 2, 3, 4], taxCode: "M SL",
    estimateMode: "manual", manualWeeklyNet: 855.87,
    brackets: [{ upTo: 15600, rate: 10.5 }, { upTo: 53500, rate: 17.5 }, { upTo: 78100, rate: 30 }, { upTo: 180000, rate: 33 }, { upTo: null, rate: 39 }],

    kiwiSaverRate: 0, otherWeekly: 0,

function defaultState() { return { version: 1, settings: defaultSettings(), paychecks: [], txns: [], expenses: [], celebrated: [], updatedAt: 0 }; }

  for (const k of ["paychecks", "txns", "expenses", "celebrated"]) st[k] = Array.isArray(o[k]) ? o[k] : [];
  st.updatedAt = +o.updatedAt || 0;

}
let state = defaultState();
const ui = { view: "dash", saveTab: "calc", txTab: "savings", group: "monthly", calc: null };

/* ---------------- storage ---------------- */
const LS_KEY = "savings-tracker-10k-v1";
const store = { ref: null, status: "local", writing: false, queued: false };

let remoteTimer = null;
function persist() {

}
async function flushRemote() {
  if (!store.ref) return;
  if (store.writing) { store.queued = true; return; }

  try { await store.ref.set({ state: JSON.stringify(state), updatedAt: state.updatedAt }); store.status = "synced"; }
  catch (e) { store.status = "error"; }

}
async function initRemote() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") { store.status = "local"; return renderSync(); }
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) { store.status = "local"; return renderSync(); }
    const id = await user.id();
    if (!id) { store.status = "local"; return renderSync(); }
    const ref = db.doc("data/users/" + id + "/tracker");
    const snap = await ref.get();
    store.ref = ref;
    if (snap.exists) {
      const d = snap.data() || {};
      let remote = null; try { remote = normalize(JSON.parse(d.state)); } catch (e) { }
      if (remote && remote.updatedAt >= state.updatedAt) { state = remote; saveLocal(); renderAll(); }
      else if (state.updatedAt > 0) await flushRemote();
    } else if (state.updatedAt > 0) await flushRemote();
    store.status = "synced";

}
function renderSync() {
  const el = document.getElementById("sync");
  const map = { synced: ["ok", "Saved to your Claude account"], local: ["", "Saved in this browser"], error: ["err", "Offline · saved in this browser"] };
  const [cls, txt] = map[store.status] || map.local;
  el.className = "sync " + cls; el.querySelector("span").textContent = txt;

/* ---------------- payroll model ---------------- */
const hoursPerDay = s => s.workDays.length ? s.weeklyHours / s.workDays.length : 0;
function workDaysIn(s, a, b) {
  const start = a < s.startDate ? s.startDate : a;
  let n = 0;
  for (let d = start; d <= b; d = addDays(d, 1)) if (s.workDays.includes(dow(d))) n++;
  return n;
}
function annualTax(inc, br) {
  let t = 0, prev = 0;
  for (const b of br) {
    const top = b.upTo == null || b.upTo === "" ? Infinity : +b.upTo;
    if (inc > prev) t += (Math.min(inc, top) - prev) * (+b.rate) / 100;
    prev = top; if (inc <= top) break;
  }
  return t;
}
const periodsPerYear = days => days === 7 ? 52 : days === 14 ? 26 : days === 28 ? 13 : 364 / days;
/* Itemised NZ PAYE estimate for one pay period (tax code M SL by default). */
function calcDeductions(s, gross, days) {
  const P = periodsPerYear(days);
  const paye = annualTax(gross * P, s.brackets) / P;
  const acc = Math.min(gross, s.accCap / P) * s.accRate / 100;
  const sl = s.studentLoan ? Math.max(0, gross - s.slThreshold / P) * s.slRate / 100 : 0;
  return { paye, acc, sl };
}
function estimate(s, hours, days) {
  const gross = hours * s.hourlyRate;
  let { paye, acc, sl } = calcDeductions(s, gross, days);
  if (s.estimateMode === "manual") {
    const fullGross = s.weeklyHours * s.hourlyRate;
    const ratio = fullGross > 0 ? Math.min(1, s.manualWeeklyNet / fullGross) : 0;
    const totalDed = gross * (1 - ratio), calcTot = paye + acc + sl;
    if (calcTot > 0) { const k = totalDed / calcTot; paye *= k; acc *= k; sl *= k; } else { paye = totalDed; acc = 0; sl = 0; }
  }
  const ks = gross * s.kiwiSaverRate / 100;
  const other = s.otherWeekly * days / 7;
  const net = Math.max(0, gross - paye - acc - sl - ks - other);
  return { hours, gross, paye, acc, sl, ks, other, net };
}
/* Expected (not confirmed) paydays from the pay schedule settings. */
function schedule(s, until) {
  const out = [];
  if (!isDate(s.firstPayday)) return out;
  const f = Math.max(1, +s.payFrequency || 7);
  let d = s.firstPayday, guard = 0;
  while (d <= until && guard++ < 400) {
    const pe = addDays(d, -(+s.periodEndLag || 0));
    const ps = addDays(pe, -(f - 1));
    const wd = pe < s.startDate ? 0 : workDaysIn(s, ps, pe);
    if (wd > 0) out.push({ date: d, periodStart: ps, periodEnd: pe, workDays: wd, ...estimate(s, wd * hoursPerDay(s), f) });
    d = addDays(d, f);
  }

}
const signedAmt = t => t.type === "withdrawal" ? -Math.abs(t.amount) : t.type === "adjustment" ? +t.amount : Math.abs(t.amount);
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0));

/* The single source of every derived number in the app. */
function compute(st = state, ov = {}, balanceOverride = null) {
  const s = { ...st.settings, ...ov };
  const today = todayISO();
  const txns = [...st.txns].sort(byDate);
  const realBalance = s.startBalance + sum(txns, signedAmt);
  const balance = balanceOverride != null ? balanceOverride : realBalance;
  const pcs = [...st.paychecks].sort((a, b) => a.payDate < b.payDate ? -1 : 1);
  const depById = Object.fromEntries(st.txns.map(t => [t.id, t]));
  const pending = sum(pcs.filter(p => !p.depositId || !depById[p.depositId]), p => p.savedPlanned);
  const netTotal = sum(pcs, p => p.net);
  const savingsRate = netTotal > 0 ? Math.min(1, sum(pcs, p => p.savedPlanned) / netTotal) : s.defaultSavePct / 100;

  const sched = schedule(s, addDays(s.deadline, 400));
  const used = new Set();
  for (const p of sched) {
    const m = pcs.find(c => !used.has(c.id) && (Math.abs(daysBetween(c.payDate, p.date)) <= 3 || (isDate(c.periodStart) && isDate(c.periodEnd) && c.periodStart <= p.periodEnd && p.periodEnd <= c.periodEnd)));
    if (m) { used.add(m.id); p.paycheck = m; }
  }
  const schedTo = sched.filter(p => p.date <= s.deadline);
  const W = sum(schedTo, p => p.net);
  const goalGap = s.goal - s.startBalance;
  for (const p of schedTo) p.targetShare = W > 0 ? goalGap * p.net / W : 0;
  const future = schedTo.filter(p => !p.paycheck);
  const futureAll = sched.filter(p => !p.paycheck);
  const overdue = future.filter(p => p.date < today);
  const futureNet = sum(future, p => p.net);
  const targetAt = t => {
    if (W > 0) return s.startBalance + sum(schedTo.filter(p => p.date <= t), p => p.targetShare);
    const span = daysBetween(s.startDate, s.deadline); if (span <= 0) return s.goal;
    const f = Math.min(1, Math.max(0, daysBetween(s.startDate, t) / span));
    return s.startBalance + goalGap * f;
  };
  const remaining = Math.max(0, s.goal - balance);
  const needFromFuture = Math.max(0, s.goal - balance - pending);
  const daysLeft = Math.max(0, daysBetween(today, s.deadline));
  const weeksLeft = Math.max(1, daysLeft / 7);
  const neededPct = futureNet > 0 ? needFromFuture / futureNet : (needFromFuture > 0 ? Infinity : 0);
  const projected = balance + pending + futureNet * savingsRate;
  const maxPossible = balance + pending + futureNet;
  const targetNow = targetAt(today);
  const projectDate = (amount, rate = savingsRate, startBal = balance + pending) => {
    let cum = startBal;
    if (cum >= amount - 0.005) return { date: today, now: true };
    if (rate <= 0) return null;
    for (const p of futureAll) { cum += p.net * rate; if (cum >= amount - 0.005) return { date: p.date < today ? today : p.date }; }
    return null;
  };
  return {
    s, today, txns, pcs, balance, realBalance, pending, savingsRate, sched, schedTo, future, futureAll, overdue, futureNet,
    targetAt, targetNow, remaining, needFromFuture, daysLeft, weeksLeft, neededPct, projected, maxPossible,
    perWeek: needFromFuture / weeksLeft, perPayday: future.length ? needFromFuture / future.length : null,
    progress: s.goal > 0 ? Math.min(1, Math.max(0, balance / s.goal)) : 0,
    ahead: balance - targetNow, projectDate, depById, started: today >= s.startDate
  };
}
function milestoneList(c) {
  const list = MILESTONES.filter(m => m < c.s.goal); list.push(c.s.goal);
  let bal = c.s.startBalance; const reached = {};
  for (const m of list) if (bal >= m) reached[m] = "start";
  for (const t of c.txns) { bal += signedAmt(t); for (const m of list) if (!reached[m] && bal >= m - 0.005) reached[m] = t.date; }
  return list.map(m => ({ amount: m, reached: c.balance >= m - 0.005 ? reached[m] || c.today : null, projected: c.balance >= m - 0.005 ? null : c.projectDate(m) }));
}
function weeksModel(c) {
  const s = c.s, hpd = hoursPerDay(s), out = [];
  let ws = weekStart(s.startDate);
  const linked = new Set(c.pcs.map(p => p.depositId).filter(Boolean));
  const remainingFutureNet = c.futureNet;
  while (ws <= s.deadline) {
    const we = addDays(ws, 6);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const inRange = d >= s.startDate && d <= s.deadline;
      days.push({ date: d, inRange, work: inRange && s.workDays.includes(dow(d)), holiday: HOLIDAYS[d] || null });
    }
    const nWork = days.filter(x => x.work).length;
    const est = estimate(s, nWork * hpd, 7);
    const pays = c.schedTo.filter(p => p.date >= ws && p.date <= we);
    const target = sum(pays, p => p.targetShare);
    const pcsHere = pays.map(p => p.paycheck).filter(Boolean);
    const linkedDeps = pcsHere.map(p => c.depById[p.depositId]).filter(Boolean);
    const looseDeps = c.txns.filter(t => t.type === "deposit" && !linked.has(t.id) && t.date >= ws && t.date <= we);
    const deposited = sum(linkedDeps, t => t.amount) + sum(looseDeps, t => t.amount);
    const catchUp = remainingFutureNet > 0 ? sum(pays.filter(p => !p.paycheck), p => c.needFromFuture * p.net / remainingFutureNet) : 0;
    let status;
    const due = pays.filter(p => p.date <= c.today);
    if (ws > c.today) status = "upcoming";
    else if (due.some(p => !p.paycheck)) status = "awaiting";
    else if (target > 0 && deposited >= target - 0.01) status = "saved";
    else if (pcsHere.some(p => !p.depositId || !c.depById[p.depositId])) status = "paid";
    else if (we < c.today && target > 0 && deposited < target - 0.01) status = "missed";
    else if (!pays.length) status = we < c.today ? "nopay" : "upcoming";
    else if (deposited > 0 && pays.every(p => p.paycheck)) status = deposited >= target - 0.01 ? "saved" : "missed";
    else status = "upcoming";
    out.push({ ws, we, days, nWork, hours: nWork * hpd, est, pays, target, deposited, catchUp, status, pcsHere, current: c.today >= ws && c.today <= we });
    ws = addDays(ws, 7);
  }
  return out;
}

/* ---------------- icons ---------------- */
const I = {

const VIEWS = [["dash", "Dashboard"], ["pay", "Paychecks"], ["save", "Savings"], ["txn", "Transactions"], ["stats", "Analytics"], ["set", "Settings"]];

function renderNav() {

}
function renderAll() {
  const c = compute();
  document.getElementById("appTitle").textContent = money0(c.s.goal).replace(/,000$/, "K") + " by " + fmtDate(c.s.deadline, { month: "long", day: undefined });
  document.getElementById("appSub").textContent = money(c.balance) + " saved · " + pct(c.progress) + " of goal";

  const v = document.getElementById("view");
  destroyCharts();

const hasSample = () => state.paychecks.some(p => p.sample) || state.txns.some(t => t.sample) || state.expenses.some(e => e.sample);
const hasRealData = () => state.paychecks.some(p => !p.sample) || state.txns.some(t => !t.sample) || state.expenses.some(e => !e.sample);
function sampleBanner() {
  return hasSample() ? `<div class="sample-banner"><span><b>Sample data is showing.</b> These example entries are not yours.</span><button class="btn sm" data-act="clear-sample">Remove sample data</button></div>` : "";
}
function statusPill(c) {
  if (c.balance >= c.s.goal) return `<span class="pill gold">Goal reached</span>`;
  if (!c.started && c.balance <= c.s.startBalance) return `<span class="pill info">Starts ${fmtDate(c.s.startDate)}</span>`;
  if (c.ahead >= 1) return `<span class="pill good">Ahead by ${money(c.ahead)}</span>`;
  if (c.ahead > -1) return `<span class="pill good">On track</span>`;
  return `<span class="pill bad">Behind by ${money(-c.ahead)}</span>`;
}
function ring(p) {

  return `<div class="ring" role="img" aria-label="${pct(p)} of goal saved"><svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--accent-soft)" stroke-width="14"/><circle cx="84" cy="84" r="${R}" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" style="transition:stroke-dashoffset .8s ease"/></svg><div class="pct"><div><b>${pct(p, p > 0 && p < .1 ? 1 : 0)}</b><span>of goal</span></div></div></div>`;
}
function scheduleNote(c) {
  return c.s.payConfirmed ? "" : `<div class="note info"><b>Payday not confirmed yet</b><span>Pay forecasts assume weekly pay on Wednesdays for the week before (first pay ${fmtDate(c.s.firstPayday)}). Set your real payday once you know it.</span><div><button class="btn sm" data-act="goto-pay-settings">Set my payday</button></div></div>`;
}

function viewDash(c) {
  const s = c.s;
  const next = c.future.find(p => p.date >= c.today) || null;
  const nextSave = next && isFinite(c.neededPct) ? Math.min(next.net, next.net * c.neededPct) : null;
  const shortfall = s.goal - c.projected;
  const pendingPcs = c.pcs.filter(p => p.savedPlanned > 0 && (!p.depositId || !c.depById[p.depositId]));
  let gap = "";
  if (c.balance < s.goal) {
    if (c.maxPossible < s.goal - 0.5) {
      gap = `<div class="note warn"><b>Wages alone fall ${money(s.goal - c.maxPossible)} short</b><span>Saving 100% of every pay that arrives by ${fmtDate(s.deadline)} gets you about ${money(c.maxPossible)}. The rest needs extra hours, a gift, interest or a later deadline. Your last week of December is usually paid in January.</span></div>`;
    } else if (shortfall > 0.5) {
      gap = `<div class="note warn"><b>${money(shortfall)} short at your current rate</b><span>You're saving ${pct(c.savingsRate)} of take-home pay. Saving ${pct(c.neededPct)} of each remaining pay gets you there.</span></div>`;

      <div><b>${c.daysLeft}</b><span>days left</span></div>
      <div><b>${c.perPayday != null ? money0(c.perPayday) : "—"}</b><span>per payday</span></div>
    </div>
  </section>
  ${next ? `<section class="card">
    <div class="card-h"><h2>Next pay</h2><span class="pill ${c.s.payConfirmed ? "neutral" : "info"}">${c.s.payConfirmed ? "Expected" : "Assumed"}</span></div>
    <div class="nextpay"><div class="dateblock"><span>${DOW[nd.getUTCDay()]}</span><b>${nd.getUTCDate()}</b><span>${nd.toLocaleDateString("en-NZ", { timeZone: "UTC", month: "short" })}</span></div>
      <div><div class="xs muted">Put away</div><div class="amt-l">${money(nextSave)}</div><div class="xs muted">${isFinite(c.neededPct) ? pct(Math.min(1, c.neededPct)) : "100%"} of about ${money(next.net)} take-home · ${next.workDays} workday${next.workDays === 1 ? "" : "s"}</div></div></div>
    <div class="actions" style="display:grid;grid-template-columns:${scan.mode ? "1fr 1fr" : "1fr"};gap:8px">${scan.mode ? `<button class="btn" data-act="scan-pay" data-date="${next.date}">${I.camera} Upload payslip</button>` : ""}<button class="btn primary" data-act="add-pay" data-date="${next.date}">${I.plus} Record this pay</button></div>
    ${c.overdue.length ? `<div class="note warn"><b>${c.overdue.length} expected pay${c.overdue.length > 1 ? "s" : ""} not recorded</b><span>${c.overdue.map(p => fmtDate(p.date)).join(", ")}. Record it once the money is in your account.</span></div>` : ""}
  </section>` : `<section class="card"><div class="empty"><b>No more paydays before ${fmtDate(s.deadline)}</b><span>Check your pay schedule in Settings.</span></div></section>`}
  <section class="qa" aria-label="Quick actions">
    <button class="btn primary" data-act="add-pay">${I.pay}Add Paycheck</button>
    <button class="btn" data-act="add-txn" data-type="deposit">${I.piggy}Add Savings</button>
    <button class="btn" data-act="add-exp">${I.cart}Add Expense</button>
    <button class="btn" data-nav="save">${I.save}View Progress</button>
    <button class="btn" data-act="edit-goal">${I.flag}Update Goal</button>
    <button class="btn" data-act="export">${I.out}Export Data</button>
  </section>
  <div class="grid4">
    <div class="tile"><span class="label">Per week</span><b>${money(c.perWeek)}</b><span class="xs">to stay on track</span></div>
    <div class="tile"><span class="label">By ${fmtDate(s.deadline)}</span><b>${money(c.projected)}</b><span class="xs">${c.projected >= s.goal ? "meets your goal" : money(s.goal - c.projected) + " short"}</span></div>
    <div class="tile"><span class="label">Target today</span><b>${money(c.targetNow)}</b><span class="xs">${c.ahead >= -1 ? "you're on schedule" : money(-c.ahead) + " behind"}</span></div>
    <div class="tile"><span class="label">Paydays left</span><b>${c.future.length}</b><span class="xs">before ${fmtDate(s.deadline)}</span></div>
  </div>
  ${c.balance < s.goal || pendingPcs.length ? `<section class="card">
    <div class="card-h"><h2>On track?</h2></div>

  </section>` : ""}
  ${scheduleNote(c)}
  <section class="card">

    <div class="chartbox"><canvas id="ch-balance-mini" aria-label="Savings balance over time compared with target"></canvas></div>
  </section>
  <section class="card">
    <div class="card-h"><h2>Recent activity</h2><button class="btn ghost sm" data-nav="txn">See all</button></div>

function emptyStart() {

const TX_META = { deposit: ["dep", "+", "Deposit"], withdrawal: ["wd", "−", "Withdrawal"], interest: ["int", "%", "Interest"], adjustment: ["adj", "±", "Adjustment"] };
function txRow(t, compact = false) {

  const pc = t.paycheckId ? state.paychecks.find(p => p.id === t.paycheckId) : null;

function viewPay(c) {
  const pcs = [...c.pcs].reverse();

  return `${sampleBanner()}
  <div class="card-h"><h2 class="page-title">Paychecks</h2><div class="actions">${scan.mode ? `<button class="btn" data-act="scan-pay">${I.camera} Upload payslip</button>` : ""}<button class="btn primary" data-act="add-pay">${I.plus} Add Paycheck</button></div></div>

    <p class="small muted">Estimates only. Nothing here counts as income until you record it.</p>
    ${upcoming.length ? `<div class="list">${upcoming.map(p => `<div class="row"><div class="main"><div class="t">${fmtLong(p.date)}${p.date < c.today ? ' <span class="pill warn">not recorded</span>' : ""}</div><div class="xs muted">${fmtDate(p.periodStart)}–${fmtDate(p.periodEnd)} · ${p.workDays} workday${p.workDays === 1 ? "" : "s"} · ${p.hours.toFixed(1)} h · gross ${money(p.gross)}</div></div><div class="amt">≈ ${money(p.net)}</div><button class="btn sm" data-act="add-pay" data-date="${p.date}">Record</button></div>`).join("")}</div>` : `<div class="empty"><span>No expected paydays left before your deadline.</span></div>`}

function pcCard(p) {
  const dep = p.depositId ? state.txns.find(t => t.id === p.depositId) : null;

  return `<article class="pc">

      <div><span>Gross</span><span>${money(p.gross)}</span></div>
      <div><span>PAYE + ACC</span><span>${money(p.paye)}</span></div>
      <div><span>Student loan</span><span>${money(p.sl)}</span></div>
      <div><span>KiwiSaver</span><span>${money(p.ks)}</span></div>
      <div><span>Other</span><span>${money(p.other)}</span></div>

    </div>
    ${Math.abs(p.gross - ded - p.net) > 1 ? `<p class="xs muted">Gross minus listed deductions is ${money(p.gross - ded)}; you received ${money(p.net)}. The app uses what you received.</p>` : ""}
    ${p.notes ? `<p class="small">${esc(p.notes)}</p>` : ""}
    <div class="actions" style="justify-content:space-between;align-items:center">
      ${p.savedPlanned > 0 ? (dep ? `<span class="pill good">✓ ${money(dep.amount)} in savings ${fmtDate(dep.date)}</span>` : `<span class="pill warn">Transfer of ${money(p.savedPlanned)} pending</span>`) : `<span class="pill neutral">Nothing set aside</span>`}
      <div class="actions">${p.savedPlanned > 0 && !dep ? `<button class="btn sm primary" data-act="transfer" data-id="${p.id}">Mark transferred</button>` : ""}<button class="btn sm" data-act="edit-pay" data-id="${p.id}">Edit</button><button class="btn sm danger" data-act="del-pay" data-id="${p.id}">Delete</button></div>
    </div>
  </article>`;
}

/* ---- Savings: calculator, calendar, milestones ---- */
function calcInputs(c) {
  if (!ui.calc) ui.calc = { goal: c.s.goal, deadline: c.s.deadline, startBal: r2(c.balance), rate: c.s.hourlyRate, hours: c.s.weeklyHours, custom: 75 };
  return ui.calc;
}
function calcResults(c) {
  const k = calcInputs(c);

/* ---- Analytics ---- */
function groupKey(d) { return ui.group === "weekly" ? weekStart(d) : ui.group === "monthly" ? monthKey(d) : "all"; }
function groupLabel(k) { return k === "all" ? "All time" : k.length === 7 ? toD(k + "-01").toLocaleDateString("en-NZ", { timeZone: "UTC", month: "short", year: "numeric" }) : "Wk " + fmtDate(k); }
function grouped(c) {
  const g = {};
  const get = k => g[k] || (g[k] = { gross: 0, net: 0, paye: 0, sl: 0, ks: 0, other: 0, saved: 0, dep: 0, wd: 0 });
  for (const p of c.pcs) { const o = get(groupKey(p.payDate)); o.gross += p.gross; o.net += p.net; o.paye += p.paye; o.sl += p.sl; o.ks += p.ks; o.other += p.other; o.saved += p.savedPlanned; }
  for (const t of c.txns) { const o = get(groupKey(t.date)); if (t.type === "withdrawal") o.wd += t.amount; else if (t.type === "deposit") o.dep += t.amount; }
  const keys = Object.keys(g).sort();
  return { keys, g, labels: keys.map(groupLabel) };
}

function fld(id, label, type, value, o = {}) {
  const attrs = ["min", "max", "step"].filter(k => o[k] != null).map(k => `${k}="${o[k]}"`).join(" ");
  const ds = o.set ? `data-set="${o.set}"` : "";

    ? `<select id="${id}" ${ds}>${o.options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
    : type === "textarea" ? `<textarea id="${id}" ${ds}>${esc(value)}</textarea>`
      : `<input id="${id}" type="${type}" ${type === "number" ? 'inputmode="decimal"' : ""} value="${esc(value ?? "")}" ${attrs} ${ds} ${o.required ? "required" : ""} ${o.placeholder ? `placeholder="${esc(o.placeholder)}"` : ""}>`;
  return `<div class="field ${o.full ? "full" : ""}" data-for="${id}"><label for="${id}">${label}</label>${o.money ? `<div class="money-in">${input}</div>` : input}${o.hint ? `<span class="hint">${o.hint}</span>` : ""}<span class="errmsg" hidden></span></div>`;
}

/* ---------------- charts ---------------- */
const charts = {};

      y: { grid: { color: grid }, border: { display: false }, ticks: { color: ink, font: { family: "Plus Jakarta Sans", size: 11 }, callback: v => money0(v) }, beginAtZero: true }

function balanceSeries(c) {

  if (endActual >= startX) actual.push({ x: ts(endActual), y: r2(bal) });
  const target = [{ x: ts(addDays(s.startDate, -1)), y: s.startBalance }];
  let tb = s.startBalance;
  for (const p of c.schedTo) { target.push({ x: ts(p.date), y: r2(tb) }); tb += p.targetShare; target.push({ x: ts(p.date), y: r2(tb) }); }

function updateTxForm() {

  document.querySelectorAll("[data-dep]").forEach(e => e.hidden = type !== "deposit");

  const c = compute();

  box.hidden = false;
  box.innerHTML = `<div class="label">Effect of taking out ${money(amt)}</div>

function saveTxn(existing) {
  clearErrs();
  const type = val("tx-type"), date = reqDate("tx-date", "Date");
  const amt = reqMoney("tx-amount", "Amount", { allowZero: false });
  if (!date || Number.isNaN(amt)) return;
  const c = compute();
  if ((type === "withdrawal" || (type === "adjustment" && val("tx-dir") === "down"))) {
    const curr = existing ? c.balance - signedAmt(existing) : c.balance;
    if (amt > curr + 0.005) { fieldErr("tx-amount", `You only have ${money(curr)} in savings`); return; }
  }
  const pcId = type === "deposit" ? val("tx-pc") : "";
  if (pcId) {
    const clash = state.txns.find(t => t.paycheckId === pcId && (!existing || t.id !== existing.id));
    if (clash) { fieldErr("tx-pc", `That pay already has a ${money(clash.amount)} deposit on ${fmtDate(clash.date)}. Edit that one instead.`); return; }
  }
  const amount = type === "adjustment" && val("tx-dir") === "down" ? -amt : amt;
  const f = document.getElementById("mform");
  const dup = state.txns.find(t => t.date === date && t.type === type && Math.abs(t.amount - amount) < 0.005 && (!existing || t.id !== existing.id));
  if (dup && f.dataset.dupOk !== "1") { f.dataset.dupOk = "1"; formErr(`There's already a ${money(amt)} ${type} on ${fmtDate(date)}. Press the button again only if this is a separate one.`); document.getElementById("msubmit").textContent = "Save anyway"; return; }
  const rec = existing || { id: uid(), created: Date.now() };
  const oldPc = rec.paycheckId;
  Object.assign(rec, { type, date, amount, description: val("tx-desc"), paycheckId: pcId || "", notes: val("tx-notes") });
  if (!existing) state.txns.push(rec);
  if (oldPc && oldPc !== pcId) { const p = state.paychecks.find(p => p.id === oldPc); if (p && p.depositId === rec.id) p.depositId = null; }
  if (pcId) { const p = state.paychecks.find(p => p.id === pcId); if (p) p.depositId = rec.id; }
  persist(); closeModal(); renderAll();
  toast(existing ? "Transaction updated" : type === "withdrawal" ? "Withdrawal recorded" : "Savings added");
}
function transferFor(pcId) {
  const p = state.paychecks.find(x => x.id === pcId); if (!p) return;
  txnForm(null, { type: "deposit", date: todayISO() < p.payDate ? p.payDate : todayISO(), amount: p.savedPlanned, description: "Savings from pay on " + fmtDate(p.payDate), paycheckId: p.id });
}

/* ---- export / import ---- */
function csvEsc(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(kind) {
  if (kind === "txns") return ["Date,Type,Amount,Description,Related pay date,Notes", ...[...state.txns].sort(byDate).map(t => { const p = state.paychecks.find(x => x.id === t.paycheckId); return [t.date, t.type, r2(signedAmt(t)).toFixed(2), t.description, p ? p.payDate : "", t.notes].map(csvEsc).join(","); })].join("\n");
  if (kind === "paychecks") return ["Pay date,Period start,Period end,Hours,Rate,Gross,PAYE+ACC,Student loan,KiwiSaver,Other,Net received,To savings,To spending,Transferred,Deductions source,Notes", ...[...state.paychecks].sort((a, b) => a.payDate < b.payDate ? -1 : 1).map(p => [p.payDate, p.periodStart, p.periodEnd, p.hours, p.rate, p.gross, p.paye, p.sl, p.ks, p.other, p.net, p.savedPlanned, p.spending, p.depositId ? "yes" : "no", p.deductionsSource, p.notes].map(csvEsc).join(","))].join("\n");
  return ["Date,Category,Amount,Description,Notes", ...[...state.expenses].sort(byDate).map(e => [e.date, e.category, r2(e.amount).toFixed(2), e.description, e.notes].map(csvEsc).join(","))].join("\n");
}
async function offerFile(filename, data) {
  if (!window.claude) {
    try {
      const type = filename.endsWith(".json") ? "application/json" : "text/csv";
      const file = new File([data], filename, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); toast("Shared " + filename); return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Saved " + filename); return;
    } catch (e) { if (e && e.name === "AbortError") { toast("Export cancelled"); return; } }
  }
  let dl = null; try { dl = window.claude && claude.use ? await claude.use("downloads") : null; } catch (e) { }
  if (dl) {
    try { await dl.save({ filename, data }); toast("Saved " + filename); return; }
    catch (e) { if (e && e.code === "declined") { toast("Download cancelled"); return; } if (e && e.code === "rate_limited") { toast("A save prompt is already open"); return; } }
  }
  openModal("Copy your export", `<p class="small muted">Downloads aren't available here, so copy this text and save it as <b>${esc(filename)}</b>.</p><div class="field"><textarea id="exporttext" style="min-height:220px;font-family:ui-monospace,monospace;font-size:12px" readonly>${esc(data)}</textarea></div>`, { submit: "Copy", cancel: "Close", onSubmit: async () => {
    const ta = document.getElementById("exporttext");
    try { await navigator.clipboard.writeText(ta.value); toast("Copied"); } catch (e) { ta.focus(); ta.select(); toast("Selected. Press copy on your keyboard."); }
  } });
}
function exportJSON() { offerFile("savings-backup-" + todayISO() + ".json", JSON.stringify({ app: "savings-tracker-10k", exportedAt: new Date().toISOString(), ...state }, null, 2)); }
function exportMenu() {
  openModal("Export data", `<p class="small muted">Back up everything as JSON (you can import it later), or export CSV files for a spreadsheet.</p><div class="actions"><button type="button" class="btn primary" data-act="json">JSON backup</button><button type="button" class="btn" data-act="csv" data-kind="txns">Savings CSV</button><button type="button" class="btn" data-act="csv" data-kind="paychecks">Paychecks CSV</button><button type="button" class="btn" data-act="csv" data-kind="expenses">Expenses CSV</button></div>`, { cancel: "Close" });
}
function handleImport(file) {
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(r.result); } catch (e) { return openModal("Can't import that file", `<p>It isn't valid JSON. Choose a backup exported from this app.</p>`, { cancel: "Close" }); }
    const n = normalize(o);
    if (!n || !o.settings || !Array.isArray(o.paychecks) || !Array.isArray(o.txns)) return openModal("Can't import that file", `<p>It doesn't look like a backup from this app.</p>`, { cancel: "Close" });
    const bad = n.paychecks.some(p => !isDate(p.payDate) || !isFinite(p.net)) || n.txns.some(t => !isDate(t.date) || !isFinite(t.amount) || !TX_META[t.type]);
    if (bad) return openModal("Can't import that file", `<p>Some entries have missing dates or invalid amounts.</p>`, { cancel: "Close" });
    confirmBox("Replace your data?", `This backup${o.exportedAt ? " from " + esc(new Date(o.exportedAt).toLocaleString("en-NZ")) : ""} has ${n.paychecks.length} paychecks, ${n.txns.length} savings transactions and ${n.expenses.length} expenses. It will replace everything currently in the app.`, "Replace with backup", () => {
      n.celebrated = milestoneList(compute(n)).filter(m => m.reached).map(m => m.amount);
      state = n; ui.calc = null; persist(); closeModal(); renderAll(); toast("Backup imported");
    });
  };
  r.readAsText(file);
}

/* ---- milestones celebration ---- */
function checkMilestones(c) {
  const reached = milestoneList(c).filter(m => m.reached).map(m => m.amount);
  const fresh = reached.filter(m => !state.celebrated.includes(m));
  if (!fresh.length) return;
  state.celebrated = [...new Set([...state.celebrated, ...fresh])];
  persist();
  if (!document.getElementById("modal").hidden) return;
  const m = Math.max(...fresh);
  const msgs = { 1000: "Your first thousand. The habit is working.", 2500: "A quarter of the way there.", 5000: "Halfway. Keep the rhythm going.", 7500: "Three quarters done. The finish line is in sight." };
  const isGoal = m >= c.s.goal;
  openModal(isGoal ? "Goal reached" : "Milestone reached", `<div class="celebrate"><div class="medal on">${m >= 1000 ? (m / 1000).toFixed(m % 1000 ? 1 : 0) + "K" : money0(m)}</div><h3 style="font-size:1.4rem">${money(m)} saved</h3><p class="muted">${isGoal ? `You did it: ${money(c.balance)} in savings.` : msgs[m] || "Nice progress."}</p></div>`, { cancel: "Close" });
  confetti();
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), g = cv.getContext("2d");
  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  const cols = [tok("--accent"), tok("--gold"), tok("--accent-2"), tok("--c-sl")];
  const ps = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    g.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) { p.vy += .25; p.x += p.vx; p.y += p.vy; p.a += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); }
    if (++f < 110) requestAnimationFrame(step); else { g.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

    case "rm-cat": state.settings.customCategories.splice(+b.dataset.i, 1); persist(); renderAll(); return;
    case "calc-reset": ui.calc = null; return renderAll();
    case "calc-apply": { const k = ui.calc; const s = state.settings; if (!k) return; if (!isDate(k.deadline) || k.deadline <= s.startDate || !(+k.goal > 0) || +k.rate < 0 || +k.hours < 0) return toast("Fix the calculator inputs first"); Object.assign(s, { goal: r2(+k.goal), deadline: k.deadline, hourlyRate: r2(+k.rate), weeklyHours: +k.hours }); persist(); renderAll(); return toast("Settings updated"); }
  }
});
document.addEventListener("submit", e => { if (e.target.id === "mform") { e.preventDefault(); modalSubmit && modalSubmit(); } });
document.addEventListener("input", e => {
  const id = e.target.id || "";
  if (id.startsWith("pc-") || e.target.name === "alloc") updatePayForm(id);
  if (id.startsWith("tx-")) updateTxForm();
  if (id.startsWith("calc-")) {
    const key = id.slice(5); const v = e.target.value;
    if (!ui.calc) return;
    if (key === "deadline") { if (!isDate(v) || v <= state.settings.startDate) return; ui.calc.deadline = v; }
    else { const n = Number(v); if (v === "" || !isFinite(n) || n < 0) return; ui.calc[key] = n; }
    clearTimeout(window._calcT); window._calcT = setTimeout(() => { const a = document.activeElement?.id; const pos = document.activeElement?.selectionStart; renderAll(); const el = a && document.getElementById(a); if (el) { el.focus({ preventScroll: true }); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (er) { } } }, 350);
  }
});
document.addEventListener("change", e => {
  const el = e.target, s = state.settings;
  if (el.id === "pc-transferred") updatePayForm();
  if (el.id === "pc-slip" && el.files && el.files[0]) { scanPayslip(el.files[0]); el.value = ""; return; }
  if (el.id === "importFile" && el.files[0]) { handleImport(el.files[0]); el.value = ""; return; }
  if (el.dataset.set) {
    const key = el.dataset.set, f = el.closest(".field"); const showErr = m => { if (!f) return; f.classList.toggle("err", !!m); const em = f.querySelector(".errmsg"); em.hidden = !m; em.textContent = m || ""; };
    let v = el.value;
    if (el.type === "number" || ["payFrequency", "kiwiSaverRate"].includes(key)) {
      v = Number(v);
      if (el.value === "" || !isFinite(v) || v < 0) return showErr("Enter a number of 0 or more");
      if (el.max && v > +el.max) return showErr("Must be " + el.max + " or less");
      if (key === "goal" && v <= 0) return showErr("Goal must be more than $0");
      v = ["hourlyRate", "goal", "startBalance", "manualWeeklyNet", "otherWeekly", "weeklyLimit", "monthlyLimit", "accCap", "slThreshold"].includes(key) ? r2(v) : v;
    } else if (el.type === "date") {
      if (!isDate(v)) return showErr("Enter a valid date");
      if (key === "deadline" && v <= s.startDate) return showErr("Must be after your start date");
      if (key === "startDate" && v >= s.deadline) return showErr("Must be before your deadline");
    }
    showErr(""); s[key] = v; ui.calc = null; persist(); renderAll(); toast("Saved");
  }
  if (el.dataset.setbool) { s[el.dataset.setbool] = el.checked; persist(); renderAll(); toast("Saved"); }
  if (el.dataset.workday) { const d = +el.dataset.workday; const set = new Set(s.workDays); el.checked ? set.add(d) : set.delete(d); if (!set.size) { el.checked = true; return toast("Keep at least one workday"); } s.workDays = [...set].sort(); persist(); renderAll(); toast("Saved"); }
  if (el.dataset.bracket) {
    const [i, k] = el.dataset.bracket.split(":"); const v = el.value === "" ? null : Number(el.value);
    if (k === "rate" && (v == null || v < 0 || v > 100)) return toast("Rate must be 0–100%");
    if (k === "upTo" && v != null && (!isFinite(v) || v <= 0)) return toast("Enter a positive income limit, or leave blank for the top bracket");
    s.brackets[+i][k] = v; persist(); renderAll(); toast("Tax bracket saved");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("modal").hidden) closeModal(); });
const reTheme = () => { if (Object.keys(charts).length) renderAll(); };
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", reTheme); } catch (e) { }
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------------- boot ---------------- */
(function boot() {
  const local = loadLocal(); if (local) state = local;
  const h = (location.hash || "").slice(1); const map = { dashboard: "dash", paychecks: "pay", savings: "save", transactions: "txn", analytics: "stats", settings: "set" };
  try { ui.view = map[h] || localStorage.getItem(LS_KEY + ":view") || "dash"; } catch (e) { ui.view = map[h] || "dash"; }
  if (!VIEWS.some(([k]) => k === ui.view)) ui.view = "dash";
  renderAll(); renderSync();
  if (!window.Chart) window.addEventListener("load", () => { if (window.Chart) renderAll(); });
  initRemote();
  initScan();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    const hadController = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadController || reloading) return; reloading = true; if (document.getElementById("modal").hidden) location.reload(); });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => { reg.update().catch(() => { }); document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => { }); }); }).catch(() => { });
  }
})();
</script>
